<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>YouBike 每小時在站車輛數（最終版）</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: Arial, "Noto Sans TC", sans-serif; }
  .row { display: flex; gap: 24px; }
  .box { border: 1px solid #ccc; padding: 16px; border-radius: 6px; }
  label { display: inline-block; width: 120px; }
  input { width: 100px; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: center; }
  tr.over { background: #fde0e0; }
  .summary {
    background: #f6f8fa;
    border-left: 4px solid #4caf50;
    padding: 8px 12px;
    margin-bottom: 8px;
    font-size: 14px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h2>YouBike 每小時在站車輛數（最終版）</h2>

<div class="box">
  <div>
    <label>場站</label><input id="station" value="捷運科技大樓站">
    <label>責任區</label><input id="area" value="ZJ2">
    <label>總車位</label><input id="capacity" type="number" value="28">
  </div>
  <div style="margin-top:8px">
    <label>5 點車輛數</label><input id="v5" type="number" value="0">
    <label>10–15 調度</label><input id="adj1015" type="number" value="0">
    <label>21–24 調度</label><input id="adj2124" type="number" value="0">
    <button onclick="recalc()">更新圖表</button>
  </div>
</div>

<br>

<div class="row">
  <div class="box" style="flex:2">
    <canvas id="chart" height="320"></canvas>
  </div>
  <div class="box" style="flex:1">
    <!-- ✅ 摘要文字 -->
    <div id="summary" class="summary"></div>

    <table id="tbl">
      <thead><tr><th>時間</th><th>在站</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
let chart;

function recalc() {
  const cap = +capacity.value;
  const v5 = +v5.value;
  const adj1015 = +adj1015.value;
  const adj2124 = +adj2124.value;

  const hours = [];
  const values = [];
  let cur = v5;

  for (let h = 5; h <= 23; h++) {
    hours.push(h);
    if (h >= 10 && h <= 15) cur += adj1015;
    if (h >= 21) cur += adj2124;
    values.push(cur);
  }

  /* ===== 表格 ===== */
  const tb = document.querySelector("#tbl tbody");
  tb.innerHTML = "";
  values.forEach((v,i)=>{
    const tr = document.createElement("tr");
    if (v < 0 || v > cap) tr.className = "over";
    tr.innerHTML = `<td>${hours[i]}</td><td>${v}</td>`;
    tb.appendChild(tr);
  });

  /* ===== 摘要 ===== */
  const over = values
    .map((v,i)=>({h:hours[i],v}))
    .filter(d=>d.v<0 || d.v>cap);

  let summaryText = `本站 5 點配置 <b>${v5}</b> 輛，`;
  summaryText += `10–15 點調度 <b>${adj1015}</b> 輛、`;
  summaryText += `21–24 點調度 <b>${adj2124}</b> 輛。<br>`;

  if (over.length === 0) {
    summaryText += `全日 <b>無超限時段</b>，車輛皆介於 <b>0–${cap}</b> 輛之間。`;
  } else {
    const min = over.reduce((a,b)=>a.v<b.v?a:b);
    const max = over.reduce((a,b)=>a.v>b.v?a:b);
    summaryText += `於 <b>${over[0].h}–${over[over.length-1].h} 點</b> 出現超限，`;
    summaryText += `最低 <b>${min.v}</b>（${min.h} 點）、`;
    summaryText += `最高 <b>${max.v}</b>（${max.h} 點）。`;
  }
  document.getElementById("summary").innerHTML = summaryText;

  /* ===== 圖表 ===== */
  const ymax = cap * 2;
  const ymin = -cap * 2;

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels: hours,
      datasets: [
        { label: station.value, data: values, borderColor: "green", tension: 0.3 },
        { label: "車位上限", data: hours.map(()=>cap), borderColor: "red", borderDash: [5,5] },
        { label: "0", data: hours.map(()=>0), borderColor: "orange" }
      ]
    },
    options: {
      animation: false,
      scales: { y: { min: ymin, max: ymax } },
      plugins: { tooltip: { enabled: false } }
    },
    plugins: [{
      id: "labels",
      afterDatasetsDraw(chart) {
        const ctx = chart.ctx;
        ctx.fillStyle = "red";
        ctx.font = "bold 13px Arial";
        chart.getDatasetMeta(0).data.forEach((p,i)=>{
          ctx.fillText(values[i], p.x - 10, p.y - 8);
        });
      }
    }]
  });
}

recalc();
</script>

</body>
</html>
