<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>YouBike 每小時在站車輛數（最終穩定版 v3.4）</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial; margin:20px }
input { width:120px; margin-right:10px }
button { margin-right:10px }
table { border-collapse: collapse; width:100% }
th,td { border:1px solid #ccc; padding:4px; text-align:center }
.bad { background:#ffd6d6 }
</style>
</head>
<body>

<h2>YouBike 每小時在站車輛數（最終穩定版 v3.4）</h2>

<div>
上傳 Excel <input type="file" id="fileInput">
場站 <input id="stationInput">
責任區 <input id="areaInput" disabled>
車位 <input id="capInput" disabled>
5點 <input id="xInput" value="0">
10-15 <input id="yInput" value="0">
21-24 <input id="zInput" value="0">
</div>

<div style="margin-top:10px">
<button onclick="calc()">更新圖表</button>
<button onclick="autoSolve()">自動求解 (v3.4)</button>
</div>

<canvas id="chart" height="120"></canvas>

<div id="result"></div>

<script>
let db = [];
let chart;

document.getElementById("fileInput").addEventListener("change", e=>{
  const reader = new FileReader();
  reader.onload = evt=>{
    const wb = XLSX.read(evt.target.result,{type:'binary'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    db = XLSX.utils.sheet_to_json(ws).map(r=>{
      let o = {};
      for(let k in r){
        o[k.trim()] = typeof r[k]==="string" ? r[k].trim() : r[k];
      }
      return o;
    });
    alert("Excel 載入完成，共 "+db.length+" 筆場站");
  };
  reader.readAsBinaryString(e.target.files[0]);
});

function getStation(){
  const name = document.getElementById("stationInput").value.trim();
  const row = db.find(r=>r["場站"]===name);
  if(!row){ alert("找不到場站"); return null; }
  return row;
}

function simulate(row,x,y,z){
  let v = {};
  v[5] = Number(x);
  for(let h=6;h<=23;h++){
    let base = Number(row[h]);
    let val = base;
    if(h>=10 && h<=15) val += y;
    if(h>=21 && h<=24) val += z;
    if(h>5) val += v[5];
    v[h]=Math.round(val);
  }
  return v;
}

function compliance(v,cap){
  let ok=0;
  for(let h=6;h<=23;h++){
    if(v[h]>=1 && v[h]<=cap-1) ok++;
  }
  return ok;
}

function calc(){
  const row = getStation();
  if(!row) return;
  const cap = Number(row["車位"]);
  areaInput.value = row["責任區"];
  capInput.value = cap;

  const x = Number(xInput.value);
  const y = Number(yInput.value);
  const z = Number(zInput.value);

  const v = simulate(row,x,y,z);
  render(row["場站"],cap,v);
}

function autoSolve(){
  const row = getStation();
  if(!row) return;
  const cap = Number(row["車位"]);

  // 1. 最佳解
  let v = simulate(row,0,0,0);
  if(compliance(v,cap)===18){
    show(row,0,0,0,"最佳解",v,cap); return;
  }

  // 2. 次佳解
  for(let x=0;x<=cap;x++){
    for(let y=-56;y<=56;y++){
      for(let z=-56;z<=56;z++){
        let v = simulate(row,x,y,z);
        if(compliance(v,cap)===18 && v[5]>=0){
          show(row,x,y,z,"次佳解",v,cap); return;
        }
      }
    }
  }

  // 3. 最後解
  let best={ok:-1};
  for(let x=0;x<=cap;x++){
    for(let y=-200;y<=200;y++){
      for(let z=-200;z<=200;z++){
        let v = simulate(row,x,y,z);
        if(v[5]<0) continue;
        let ok = compliance(v,cap);
        if(ok>best.ok){
          best={x,y,z,ok,v};
        }
      }
    }
  }
  show(row,best.x,best.y,best.z,"最後解",best.v,cap);
}

function show(row,x,y,z,type,v,cap){
  xInput.value=x; yInput.value=y; zInput.value=z;
  render(row["場站"],cap,v,type);
}

function render(name,cap,v,type="手動"){
  const labels=[], data=[], upper=[], zero=[];
  for(let h=5;h<=23;h++){
    labels.push(h);
    data.push(v[h]);
    upper.push(cap);
    zero.push(0);
  }

  if(chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"),{
    type:'line',
    data:{
      labels,
      datasets:[
        {label:name,data, borderColor:'green',fill:false},
        {label:'車位上限',data:upper,borderColor:'red',borderDash:[5,5]},
        {label:'0',data:zero,borderColor:'orange'}
      ]
    }
  });

  let html = `<h3>${type}：5=${xInput.value} | 10-15=${yInput.value} | 21-24=${zInput.value} | 合規=${compliance(v,cap)}</h3>`;
  html += `<table><tr><th>時間</th><th>在站</th></tr>`;
  for(let h=5;h<=23;h++){
    let cls = (h>=6 && (v[h]<1 || v[h]>cap-1)) ? "class='bad'" : "";
    html+=`<tr ${cls}><td>${h}</td><td>${v[h]}</td></tr>`;
  }
  html+=`</table>`;
  result.innerHTML = html;
}
</script>
</body>
</html>
