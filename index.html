<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>YouBike 每小時在站車輛數（最終穩定版 v3.4）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<!-- SheetJS (Excel 解析) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.19.3/dist/xlsx.full.min.js"></script>

<style>
body{font-family:"Segoe UI","Noto Sans TC",sans-serif;margin:16px}
h1{margin-bottom:12px}
.controls{
  display:grid;
  grid-template-columns:90px 260px 90px 140px 90px 120px 90px 120px;
  gap:8px;align-items:center
}
.controls label{text-align:right;font-weight:700}
.controls input{height:32px;font-size:16px;padding:0 8px}
.buttons{grid-column:1/-1;margin-top:6px}
button{padding:6px 12px;font-size:14px;margin-right:6px}
.main{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}
.panel{border:1px solid #ccc;border-radius:6px;padding:8px}
canvas{width:100%!important;height:520px!important}
.summary{font-size:18px;font-weight:700;margin-bottom:8px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:4px;text-align:center}
.bad{background:#fde2e2}
</style>
</head>

<body>
<h1>YouBike 每小時在站車輛數（最終穩定版 v3.4）</h1>

<div class="controls">
  <label>上傳 Excel</label>
  <input type="file" id="fileInput" accept=".xlsx,.xls">

  <label>場站</label>
  <input id="stationInput" placeholder="模糊搜尋">

  <label>責任區</label>
  <input id="areaInput" disabled>

  <label>總車位</label>
  <input id="capInput" disabled>

  <label>5點車輛</label>
  <input id="v5" type="number" value="0">

  <label>10–15</label>
  <input id="x" type="number" value="0">

  <label>21–24</label>
  <input id="y" type="number" value="0">
</div>

<div class="buttons">
  <button onclick="manual()">更新圖表</button>
  <button onclick="best()">最佳解</button>
  <button onclick="autoSolve()">自動求解</button>
</div>

<div class="main">
  <div class="panel">
    <canvas id="chart"></canvas>
  </div>
  <div class="panel">
    <div id="summary" class="summary">請選擇場站或上傳 Excel</div>
    <table>
      <thead><tr><th>時間</th><th>在站</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
/* ===== v3.4 核心邏輯 =====
在站(h)=v5+delta[h]
x 影響 15–23
y 影響 21–24
合規：6–23 ∈ [1, cap-1]
解順序：最佳(x=0,y=0)→次佳(x,y∈[-56,56])→最後(最大化合規)
*/

let DB=[];
let chart=null;
const H=[...Array(18)].map((_,i)=>i+6);

// ---------- Excel 上傳 ----------
document.getElementById("fileInput").addEventListener("change", e=>{
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=evt=>{
    const wb=XLSX.read(evt.target.result,{type:"binary"});
    const ws=wb.Sheets["每小時變化"];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1});
    DB=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i];
      if(!r[2]) continue;
      let deltas={};
      for(let h=6;h<=23;h++){
        deltas[h]=Number(r[h-1])||0;
      }
      DB.push({
        area:r[0],
        station:r[2],
        capacity:Number(r[3]),
        deltas:deltas
      });
    }
    summary.textContent="Excel 已載入，請選擇場站";
  };
  reader.readAsBinaryString(file);
});

// ---------- 計算 ----------
function findStation(q){
  if(!q) return null;
  return DB.find(s=>s.station.includes(q));
}
function calc(st,v5,x,y){
  return H.map(h=>{
    let v=v5+(st.deltas[h]||0);
    if(h>=15) v+=x;
    if(h>=21) v+=y;
    return v;
  });
}
function compliant(vals,cap){
  return vals.every(v=>v>=1&&v<=cap-1);
}

// ---------- 繪圖 ----------
function draw(st,vals){
  const cap=st.capacity;
  areaInput.value=st.area;
  capInput.value=cap;
  tbody.innerHTML="";
  vals.forEach((v,i)=>{
    const tr=document.createElement("tr");
    if(v<1||v>cap-1) tr.className="bad";
    tr.innerHTML=`<td>${H[i]}</td><td>${v}</td>`;
    tbody.appendChild(tr);
  });
  if(chart) chart.destroy();
  chart=new Chart(chartCanvas,{
    type:"line",
    data:{
      labels:H,
      datasets:[
        {label:"在站",data:vals,borderColor:"green",tension:.3},
        {label:"上限",data:H.map(()=>cap),borderColor:"red",borderDash:[5,5]},
        {label:"0",data:H.map(()=>0),borderColor:"orange"}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false}
  });
}

// ---------- 操作 ----------
function manual(){
  const st=findStation(stationInput.value); if(!st) return;
  const v5=+v5Input.value||0;
  const x=+document.getElementById("x").value||0;
  const y=+document.getElementById("y").value||0;
  draw(st,calc(st,v5,x,y));
  summary.textContent="手動顯示";
}
function best(){
  const st=findStation(stationInput.value); if(!st) return;
  const cap=st.capacity;
  let L=Math.max(0,...H.map(h=>1-(st.deltas[h]||0)));
  let U=Math.min(...H.map(h=>(cap-1)-(st.deltas[h]||0)));
  if(L<=U){
    draw(st,calc(st,U,0,0));
    summary.textContent="最佳解";
  }else summary.textContent="無最佳解";
}
function autoSolve(){
  const st=findStation(stationInput.value); if(!st) return;
  const cap=st.capacity;

  let L=Math.max(0,...H.map(h=>1-(st.deltas[h]||0)));
  let U=Math.min(...H.map(h=>(cap-1)-(st.deltas[h]||0)));
  if(L<=U){
    draw(st,calc(st,U,0,0));
    summary.textContent="最佳解"; return;
  }
  for(let x=-56;x<=56;x++){
    for(let y=-56;y<=56;y++){
      const vals=calc(st,0,x,y);
      if(compliant(vals,cap)){
        draw(st,vals);
        summary.textContent="次佳解"; return;
      }
    }
  }
  let bestCnt=-1,bx=0,by=0;
  for(let x=-cap;x<=cap;x++){
    for(let y=-cap;y<=cap;y++){
      const vals=calc(st,0,x,y);
      const cnt=vals.filter(v=>v>=1&&v<=cap-1).length;
      if(cnt>bestCnt){bestCnt=cnt;bx=x;by=y;}
    }
  }
  draw(st,calc(st,0,bx,by));
  summary.textContent="最後解";
}
</script>
</body>
</html>
