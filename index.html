<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>YouBike 每小時在站車輛數（最終封版）</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body { font-family:"Microsoft JhengHei", Arial; margin:20px; }
.section { border:1px solid #ccc; border-radius:8px; padding:14px; margin-bottom:14px; }
.row { display:flex; gap:24px; align-items:flex-start; }
.left { flex:2; }
.right { flex:1; }
label { display:inline-block; width:170px; }
input { padding:6px; margin:4px 0; }
button { padding:8px 14px; margin:10px 6px 0 0; cursor:pointer; }
canvas { max-height:460px; }
table { border-collapse:collapse; width:100%; font-size:14px; }
th,td { border:1px solid #ccc; padding:6px; text-align:center; }
.over { background:#f8d7da; }
.big { font-size:22px; font-weight:bold; }
</style>
</head>

<body>

<h2>YouBike 每小時在站車輛數（圖像2排版・最終封版）</h2>

<div class="section">
<b>資料來源：</b> <span id="dataSource">載入中…</span><br><br>
<input type="file" id="fileInput" accept=".xlsx">
</div>

<div class="section">
<div class="row">
  <div class="left">
    <label>場站</label>
    <input list="stations" id="station"><br>

    <label>責任區</label>
    <input id="area" readonly><br>

    <label>5 點車輛數</label>
    <input type="number" id="init" value="0"><br>

    <label>10–15 點調度</label>
    <input type="number" id="dispatch15" value="0"><br>

    <label>21–24 點調度</label>
    <input type="number" id="dispatch21" value="0"><br>
  </div>

  <div class="right">
    <div>總車位數</div>
    <div id="capacity" class="big">–</div>
  </div>
</div>

<button onclick="solveOptimal()">一鍵產出最佳解</button>
<button onclick="refresh()">更新圖表</button>
</div>

<datalist id="stations"></datalist>

<div class="section">
<div class="row">
  <div class="left"><canvas id="chart"></canvas></div>
  <div class="right"><div id="dataTable"></div></div>
</div>
</div>

<script>
let DB=[], chart=null;
let overflowRawData=[];
const HOURS=[5,...Array.from({length:18},(_,i)=>i+6)];
const stationInput=document.getElementById("station");

/* === Chart.js Plugin：紅色超限數字 === */
Chart.register({
  id:'overflowLabel',
  afterDatasetsDraw(chart){
    const ctx=chart.ctx;
    const cap=Number(document.getElementById("capacity").textContent);
    if(!overflowRawData||isNaN(cap))return;

    ctx.save();
    ctx.fillStyle="red";
    ctx.font="12px Microsoft JhengHei";

    overflowRawData.forEach((v,i)=>{
      if(v>cap||v<0){
        const x=chart.scales.x.getPixelForValue(HOURS[i]); // ★ 修正點
        const y=chart.scales.y.getPixelForValue(Math.max(0,Math.min(cap,v)));
        ctx.fillText(v,x+4,y-4);
      }
    });
    ctx.restore();
  }
});

/* === 載入 JSON === */
fetch("./default_db.json")
.then(r=>r.json())
.then(data=>{
  DB=data;
  stations.innerHTML=DB.map(d=>`<option value="${d.station}">`).join("");
  dataSource.textContent=`預設資料（JSON）共 ${DB.length} 站`;
  stationInput.value=DB[0].station;
  refresh();
});

stationInput.addEventListener("input",refresh);
stationInput.addEventListener("change",refresh);

/* === Excel 覆蓋 === */
fileInput.addEventListener("change",e=>{
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    const wb=XLSX.read(ev.target.result,{type:"array"});
    const ws=wb.Sheets["每小時變化"];
    const rows=XLSX.utils.sheet_to_json(ws);
    DB=rows.map(r=>({
      station:r["場站"],
      area:r["責任區"],
      capacity:+r["總車位數"],
      deltas:Object.fromEntries(Array.from({length:18},(_,i)=>[i+6,+r[i+6]]))
    }));
    stations.innerHTML=DB.map(d=>`<option value="${d.station}">`).join("");
    dataSource.textContent=`使用者 Excel（${DB.length} 站）`;
    stationInput.value=DB[0].station;
    refresh();
  };
  r.readAsArrayBuffer(f);
});

/* === 計算 === */
function compute(rec,b,d15,d21){
  const arr=[b];
  for(let h=6;h<=23;h++){
    let v=b+rec.deltas[h];
    if(h>=15)v+=d15;
    if(h>=21)v+=d21;
    arr.push(v);
  }
  return arr;
}

/* === 更新 === */
function refresh(){
  const rec=DB.find(d=>d.station===stationInput.value);
  if(!rec)return;

  area.value=rec.area;
  capacity.textContent=rec.capacity;

  const data=compute(rec,+init.value||0,+dispatch15.value||0,+dispatch21.value||0);
  overflowRawData=data.slice();

  drawChart(rec,data);
  drawTable(data,rec.capacity);
}

/* === 圖表 === */
function drawChart(rec,data){
  if(chart)chart.destroy();
  const cap=rec.capacity;
  const clipped=data.map(v=>Math.max(0,Math.min(cap,v)));

  chart=new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
      labels:HOURS,
      datasets:[
        {label:rec.station,data:clipped,borderColor:"green",tension:0.35},
        {label:"車位上限",data:HOURS.map(()=>cap),borderDash:[6,6],borderColor:"red"},
        {label:"0",data:HOURS.map(()=>0),borderColor:"orange"}
      ]
    }
  });
}

/* === 表格 === */
function drawTable(data,cap){
  let h="<table><tr><th>時間</th><th>在站</th></tr>";
  data.forEach((v,i)=>{
    h+=`<tr class="${(v<=0||v>=cap)?'over':''}">
          <td>${HOURS[i]}</td><td>${v}</td>
        </tr>`;
  });
  dataTable.innerHTML=h+"</table>";
}

/* === 一鍵最佳解 === */
function solveOptimal(){
  const rec=DB.find(d=>d.station===stationInput.value);
  if(!rec)return;

  for(let b=1;b<rec.capacity;b++){
    const arr=compute(rec,b,0,0);
    if(arr.every(v=>v>0&&v<rec.capacity)){
      init.value=b;
      dispatch15.value=0;
      dispatch21.value=0;
      refresh();
      return;
    }
  }
  alert("此場站無零調度可行解");
}
</script>

</body>
</html>
