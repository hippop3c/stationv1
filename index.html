<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>YouBike 每小時在站車輛數（最終穩定版 v3.4）</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial; padding:20px }
input { width:60px; margin-right:10px }
table { border-collapse: collapse; margin-top:10px }
td,th { border:1px solid #ccc; padding:4px 8px; text-align:center }
.bad { background:#fdd }
</style>
</head>
<body>

<h2>YouBike 每小時在站車輛數（最終穩定版 v3.4）</h2>

場站 <input id="input_station" value="">
責任區 <input id="input_area" value="">
車位 <input id="input_capacity" value="">

5點 <input type="number" id="input_5" value="0">
7-9 <input type="number" id="input_79" value="0">
10-15 <input type="number" id="input_1015" value="0">
21-24 <input type="number" id="input_2124" value="0">

<button onclick="run()">自動求解 (v3.4)</button>

<div>
<canvas id="chart" width="900" height="300"></canvas>
</div>

<div id="result"></div>

<script>
let db = [];
fetch("default_db.json").then(r=>r.json()).then(j=>db=j);

function run(){
  let name = document.getElementById("input_station").value.trim();
  let row = db.find(r=>r.station===name);
  if(!row){ alert("找不到場站"); return; }

  let cap = Number(row.capacity);
  document.getElementById("input_area").value = row.area;
  document.getElementById("input_capacity").value = cap;

  let adj5 = Number(input_5.value);
  let adj79 = Number(input_79.value);
  let adj1015 = Number(input_1015.value);
  let adj2124 = Number(input_2124.value);

  let base = {};
  for(let h=6;h<=23;h++){
    base[h] = row.deltas[h];
  }

  let data = {};
  let okCount = 0;

  for(let h=6;h<=23;h++){
    let v = base[h];

    if(h==5) v+=adj5;
    if(h>=7 && h<=9) v+=adj79;
    if(h>=10 && h<=15) v+=adj1015;
    if(h>=21 && h<=24) v+=adj2124;

    // 關鍵新增規則
    if(h>=10 && h<=23) v+=adj79;

    data[h]=v;
    if(v>=1 && v<=cap-1) okCount++;
  }

  drawChart(name, cap, data);
  drawTable(data, cap, okCount);
}

let chart;
function drawChart(name, cap, data){
  let labels=[], values=[];
  for(let h=6;h<=23;h++){
    labels.push(h);
    values.push(data[h]);
  }

  if(chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
      labels,
      datasets:[
        {label:name,data:values,borderColor:"green"},
        {label:"車位上限",data:labels.map(()=>cap),borderColor:"red",borderDash:[5,5]}
      ]
    }
  });
}

function drawTable(data, cap, okCount){
  let html="<h3>合規小時數："+okCount+"</h3>";
  html+="<table><tr><th>時間</th><th>在站</th></tr>";
  for(let h=6;h<=23;h++){
    let v=data[h];
    let cls=(v<1||v>cap-1)?"bad":"";
    html+=`<tr class="${cls}"><td>${h}</td><td>${v}</td></tr>`;
  }
  html+="</table>";
  result.innerHTML=html;
}
</script>

</body>
</html>
