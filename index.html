<script>
/* ===========================
   Solve: Best / Second / Fallback（依新規格）
=========================== */

/* Best:
   v5 ∈ [0,cap], d1015=0, d2124=0, 全可行
*/
function solveBest(st){
  const cap = st.capacity;
  for(let v5=0; v5<=cap; v5++){
    const vals = calcSeries(st, v5, 0, 0);
    if(isAllFeasible(st, vals)){
      return { kind:"最佳解", v5, d1015:0, d2124:0 };
    }
  }
  return null;
}

/* Second Best:
   v5 ≥ 0
   d1015,d2124 ∈ [-56,56]
   必須全可行
*/
function solveSecondBest(st){
  const cap = st.capacity;
  const LIM = 56;
  let best = null;

  for(let d1015=-LIM; d1015<=LIM; d1015++){
    for(let d2124=-LIM; d2124<=LIM; d2124++){
      for(let v5=0; v5<=cap; v5++){
        const vals = calcSeries(st, v5, d1015, d2124);
        if(isAllFeasible(st, vals)){
          const mag = Math.abs(d1015) + Math.abs(d2124);
          if(!best || mag < best.mag){
            best = { kind:"次佳解", v5, d1015, d2124, mag };
          }
        }
      }
    }
  }
  return best;
}

/* Fallback:
   v5 ≥ 0
   調度不限制
   最小化 violation
*/
function solveFallback(st){
  const cap = st.capacity;
  const LIM = cap; // 合理上限
  let best = null;

  for(let d1015=-LIM; d1015<=LIM; d1015++){
    for(let d2124=-LIM; d2124<=LIM; d2124++){
      for(let v5=0; v5<=cap; v5++){
        const vals = calcSeries(st, v5, d1015, d2124);
        const viol = totalViolation(st, vals);
        const mag = Math.abs(d1015) + Math.abs(d2124);
        if(!best ||
           viol < best.viol ||
           (viol === best.viol && mag < best.mag)){
          best = { kind:"最後解", v5, d1015, d2124, viol, mag };
        }
      }
    }
  }
  return best;
}

/* 保證每站至少一解 */
function solveAuto(st){
  return solveBest(st) || solveSecondBest(st) || solveFallback(st);
}
</script>
