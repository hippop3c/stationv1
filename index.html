<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>YouBike 每小時在站車輛數（最終穩定版）</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<style>
  body { font-family: Arial, "Microsoft JhengHei"; margin: 20px; }
  h1 { margin-bottom: 10px; }
  .box { border: 1px solid #cfd8e3; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  label { font-weight: bold; }
  input { padding: 4px 6px; }
  button { padding: 6px 10px; }
  .main { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 16px; }
  th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
  tr.bad { background: #fde2e2; }
  .summary { font-size: 18px; font-weight: bold; background: #f3f8f3; padding: 8px; border-left: 5px solid #3a9a5b; margin-bottom: 8px; }
</style>
</head>

<body>
<h1>YouBike 每小時在站車輛數（最終穩定版）</h1>

<div class="box">
  <div class="row">
    <label>場站</label><input id="station" size="14">
    <label>責任區</label><input id="area" size="6" readonly>
    <label>總車位</label><input id="cap" size="4" readonly>
    <label>5 點車輛數</label><input id="base5" type="number" value="0">
    <label>10–15 調度</label><input id="d10" type="number" value="0">
    <label>21–24 調度</label><input id="d21" type="number" value="0">
    <button onclick="render()">更新圖表</button>
  </div>
  <div style="margin-top:6px;font-size:14px;">資料來源：default_db.json</div>
</div>

<div class="main">
  <div class="box">
    <canvas id="chart"></canvas>
  </div>

  <div class="box">
    <div id="summary" class="summary"></div>
    <table>
      <thead><tr><th>時間</th><th>在站</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
let DB = [];
let chart;

fetch("default_db.json")
  .then(r => r.json())
  .then(j => DB = j);

function findStation(name) {
  return DB.find(s => s.station.includes(name));
}

/* ✅ 核心修正後的正確計算邏輯 */
function compute(cur, base5, d10, d21) {
  let out = [];
  let v = base5;

  for (let h = 5; h <= 23; h++) {
    if (h === 5) {
      v = base5;
    } else {
      if (cur.deltas[h] !== undefined) {
        v = v + cur.deltas[h]; // 只加「該小時」變化
      }
      if (h === 10) v += d10;
      if (h === 21) v += d21;
    }
    out.push({ h, v });
  }
  return out;
}

function render() {
  const name = station.value.trim();
  const cur = findStation(name);
  if (!cur) {
    alert("找不到場站");
    return;
  }

  area.value = cur.area;
  cap.value = cur.capacity;

  const base5 = +base5Input.value || 0;
  const d10v = +d10.value || 0;
  const d21v = +d21.value || 0;

  const data = compute(cur, base5, d10v, d21v);

  // 表格
  let badHours = [];
  tbody.innerHTML = "";
  data.forEach(r => {
    const tr = document.createElement("tr");
    if (r.v < 0 || r.v > cur.capacity) {
      tr.className = "bad";
      badHours.push(r.h);
    }
    tr.innerHTML = `<td>${r.h}</td><td>${r.v}</td>`;
    tbody.appendChild(tr);
  });

  summary.textContent =
    badHours.length === 0
      ? `5點=${base5}｜10–15=${d10v}｜21–24=${d21v}｜全日皆於 0–${cur.capacity}`
      : `超限時段：${badHours.join(",")} 點`;

  // 圖表
  const labels = data.map(d => d.h);
  const vals = data.map(d => d.v);

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels,
      datasets: [
        {
          label: cur.station,
          data: vals,
          borderColor: "green",
          tension: 0.3,
          pointRadius: 3
        },
        {
          label: "上限",
          data: labels.map(_ => cur.capacity),
          borderColor: "red",
          borderDash: [5,5],
          pointRadius: 0
        },
        {
          label: "0",
          data: labels.map(_ => 0),
          borderColor: "orange",
          pointRadius: 0
        }
      ]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          min: -cur.capacity * 2,
          max: cur.capacity * 2
        }
      }
    }
  });
}

// 綁定 input
const base5Input = document.getElementById("base5");
</script>
</body>
</html>
