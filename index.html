<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>YouBike 每小時在站車輛數（最終穩定版）</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 20px;
}

h1 {
  margin-bottom: 12px;
}

/* ===== 控制區 ===== */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
  align-items: center;
  padding: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.controls label {
  min-width: 80px;
}

.controls input {
  width: 160px;
  padding: 4px 6px;
}

.controls button {
  padding: 6px 14px;
  cursor: pointer;
}

/* ===== 主畫面 ===== */
.main {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
  margin-top: 16px;
}

/* ===== 摘要 ===== */
.summary {
  background: #f7f9fb;
  border-left: 4px solid #2e7d32;
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 15px;
}

/* ===== 表格 ===== */
table {
  border-collapse: collapse;
  width: 100%;
}

th, td {
  border: 1px solid #ccc;
  padding: 4px 6px;
  text-align: center;
}

tr.bad {
  background: #fde2e2;
}
</style>
</head>

<body>
<h1>YouBike 每小時在站車輛數（最終穩定版）</h1>

<div class="controls">
  <label>場站</label>
  <input id="stationInput" />

  <label>責任區</label>
  <input id="areaInput" disabled />

  <label>總車位</label>
  <input id="capInput" disabled />

  <label>5 點車輛數</label>
  <input id="v5" type="number" value="0" />

  <label>10–15 調度</label>
  <input id="d1015" type="number" value="0" />

  <label>21–24 調度</label>
  <input id="d2124" type="number" value="0" />

  <button onclick="update()">更新圖表</button>
  <button onclick="best()">一鍵產出最佳解</button>
</div>

<div class="main">
  <div>
    <canvas id="chart" height="160"></canvas>
  </div>

  <div>
    <div id="summary" class="summary">請輸入場站</div>
    <table>
      <thead>
        <tr><th>時間</th><th>在站</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
let DB = [];
let chart;

/* ===== 載入 JSON ===== */
fetch("default_db.json")
  .then(r => r.json())
  .then(j => DB = j);

/* ===== 模糊搜尋 ===== */
function findStation(name) {
  return DB.find(s => s.station.includes(name));
}

/* ===== 核心計算（正確版） ===== */
function calc(st, v5, d1015, d2124) {
  const hours = [];
  const vals = [];

  for (let h = 5; h <= 23; h++) {
    let v = v5;

    if (h !== 5 && st.deltas[String(h)] !== undefined) {
      v += st.deltas[String(h)];
    }

    if (h >= 10 && h <= 15) v += d1015;
    if (h >= 21 && h <= 23) v += d2124;

    hours.push(h);
    vals.push(v);
  }
  return { hours, vals };
}

/* ===== 更新 ===== */
function update() {
  const name = stationInput.value.trim();
  const st = findStation(name);

  if (!st) {
    summary.innerText = "找不到場站，請輸入更完整站名（支援模糊搜尋）";
    return;
  }

  areaInput.value = st.area;
  capInput.value = st.capacity;

  const v5n = Number(v5.value);
  const d1015n = Number(d1015.value);
  const d2124n = Number(d2124.value);

  const { hours, vals } = calc(st, v5n, d1015n, d2124n);

  renderChart(st, hours, vals);
  renderTable(st, hours, vals);
  renderSummary(st, v5n, d1015n, d2124n, vals);
}

/* ===== 圖 ===== */
function renderChart(st, hours, vals) {
  const cap = st.capacity;
  const up = Array(hours.length).fill(cap);
  const low = Array(hours.length).fill(0);

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels: hours,
      datasets: [
        {
          label: st.station,
          data: vals,
          borderColor: "green",
          tension: 0.3,
          pointRadius: 3
        },
        {
          label: "車位上限",
          data: up,
          borderColor: "red",
          borderDash: [6,4],
          pointRadius: 0
        },
        {
          label: "0",
          data: low,
          borderColor: "orange",
          pointRadius: 0
        }
      ]
    },
    options: {
      plugins: {
        legend: { position: "top" },
        tooltip: { enabled: true }
      },
      scales: {
        y: {
          min: Math.min(...vals, 0) - 5,
          max: Math.max(...vals, cap) + 5
        }
      }
    }
  });
}

/* ===== 表格 ===== */
function renderTable(st, hours, vals) {
  tbody.innerHTML = "";
  hours.forEach((h, i) => {
    const tr = document.createElement("tr");
    if (vals[i] < 0 || vals[i] > st.capacity) tr.className = "bad";
    tr.innerHTML = `<td>${h}</td><td>${vals[i]}</td>`;
    tbody.appendChild(tr);
  });
}

/* ===== 摘要 ===== */
function renderSummary(st, v5n, d1015n, d2124n, vals) {
  const bad = vals
    .map((v,i)=>({v,i}))
    .filter(x => x.v < 0 || x.v > st.capacity);

  if (bad.length === 0) {
    summary.innerText =
      `5 點配置 ${v5n} 輛，10–15 調度 ${d1015n}，21–24 調度 ${d2124n}。\n全日無超限，皆介於 0–${st.capacity}。`;
  } else {
    const min = Math.min(...vals);
    const max = Math.max(...vals);
    summary.innerText =
      `5 點配置 ${v5n} 輛，10–15 調度 ${d1015n}，21–24 調度 ${d2124n}。\n超限 ${bad[0].i+5}–${bad.at(-1).i+5} 點，最低 ${min}，最高 ${max}。`;
  }
}

/* ===== 最佳解 ===== */
function best() {
  const name = stationInput.value.trim();
  const st = findStation(name);
  if (!st) return;

  for (let v = 0; v <= st.capacity; v++) {
    const { vals } = calc(st, v, 0, 0);
    if (vals.every(x => x >= 0 && x <= st.capacity)) {
      v5.value = v;
      d1015.value = 0;
      d2124.value = 0;
      update();
      return;
    }
  }
  alert("找不到最佳解");
}
</script>
</body>
</html>
